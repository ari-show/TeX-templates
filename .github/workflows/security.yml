name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Audit npm dependencies
        run: npm audit --package-lock-only
